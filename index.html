<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🕌 Namaz Timings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 22px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 18px;
        }
        .header h1 { color: #fff; font-size: 26px; font-weight: 700; }
        .header h1 span { color: #00e5ff; }
        .header .badge {
            background: rgba(105,219,124,0.12);
            color: #69db7c;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
            display: inline-block;
            border: 1px solid rgba(105,219,124,0.15);
        }
        .header p { color: #8892b0; font-size: 13px; margin-top: 4px; }

        .status-bar {
            background: transparent !important;
            padding: 8px 14px;
            margin-bottom: 12px;
            color: #ccd6f6;
            font-size: 13px;
            border-left: 3px solid #fcc419;
        }
        .status-bar.success { border-left-color: #69db7c; color: #69db7c; }
        .status-bar.error { border-left-color: #ff6b6b; color: #ff6b6b; }
        .status-bar.loading { border-left-color: #fcc419; color: #fcc419; }
        .status-bar.update { border-left-color: #fcc419; color: #fcc419; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ===== MAIN BOX ===== */
        .main-box {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .main-box .box-title {
            color: #64ffda;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .main-box .box-title i { color: #64ffda; }
        .main-box .box-title span {
            background: rgba(100,255,218,0.08);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 10px;
            color: #64ffda;
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .time-item {
            text-align: center;
            padding: 8px 4px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }
        .time-item label {
            display: block;
            color: #8892b0;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .time-item .time-value {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            padding: 4px;
            min-height: 32px;
        }

        /* ===== GOLD ANIMATED FRIDAY BOX ===== */
        .friday-box {
            background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,215,0,0.02));
            border: 2px solid #ffd700;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
            animation: goldGlow 2s ease-in-out infinite;
        }
        .friday-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent,
                rgba(255,215,0,0.05),
                transparent,
                rgba(255,215,0,0.05),
                transparent
            );
            animation: goldRotate 4s linear infinite;
        }
        .friday-box::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                135deg,
                transparent 30%,
                rgba(255,215,0,0.04) 50%,
                transparent 70%
            );
            animation: goldShine 3s ease-in-out infinite;
        }
        .friday-box .box-title,
        .friday-box .friday-single {
            position: relative;
            z-index: 2;
        }

        @keyframes goldGlow {
            0%, 100% { 
                box-shadow: 0 0 15px rgba(255,215,0,0.15), inset 0 0 15px rgba(255,215,0,0.05);
                border-color: #ffd700;
            }
            50% { 
                box-shadow: 0 0 30px rgba(255,215,0,0.25), inset 0 0 25px rgba(255,215,0,0.08);
                border-color: #ffed4a;
            }
        }
        @keyframes goldRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes goldShine {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        .friday-box .box-title {
            color: #ffd700;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(255,215,0,0.2);
        }
        .friday-box .box-title i {
            color: #ffd700;
            animation: goldPulse 1.5s ease-in-out infinite;
        }
        @keyframes goldPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .friday-box .box-title span {
            background: rgba(255,215,0,0.12);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 10px;
            color: #ffd700;
            border: 1px solid rgba(255,215,0,0.15);
        }

        .friday-single {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .friday-single label {
            color: #ffd700;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255,215,0,0.1);
        }
        .friday-single .time-value {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            padding: 6px 18px;
            background: rgba(255,215,0,0.06);
            border-radius: 8px;
            border: 1.5px solid rgba(255,215,0,0.15);
            min-width: 80px;
            text-align: center;
        }
        .friday-single .friday-badge {
            background: rgba(255,215,0,0.08);
            color: #ffd700;
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 10px;
            border: 1px solid rgba(255,215,0,0.08);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 12px 0;
            flex-wrap: wrap;
            gap: 8px;
        }
        .action-bar button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #8892b0;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
            font-weight: 500;
        }
        .action-bar button:hover { background: rgba(255,255,255,0.08); color: #ccd6f6; }
        .action-bar .badge {
            background: rgba(105,219,124,0.08);
            color: #69db7c;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }
        .action-bar .badge.update {
            background: rgba(252,196,25,0.08);
            color: #fcc419;
            animation: pulse 1s infinite;
        }

        .footer {
            text-align: center;
            margin-top: 14px;
            color: #495670;
            font-size: 11px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .footer a { color: #00e5ff; text-decoration: none; cursor: pointer; }

        @media (max-width: 500px) {
            .time-grid { grid-template-columns: repeat(3, 1fr); }
            .friday-single .time-value { font-size: 15px; padding: 4px 12px; min-width: 60px; }
        }
        @media (max-width: 380px) {
            .time-grid { grid-template-columns: repeat(2, 1fr); }
            .friday-single .time-value { font-size: 14px; padding: 4px 10px; min-width: 50px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🕌 Namaz <span>Timings</span></h1>
        <div class="badge">👀 Live View</div>
        <p>Auto-updates in real-time</p>
    </div>

    <div class="status-bar loading" id="statusBar">
        <span>⏳</span> Loading timings...
    </div>

    <!-- ===== MAIN BOX (Monday) ===== -->
    <div class="main-box">
        <div class="box-title">
            <i class="fas fa-calendar-day"></i> Monday <span>Default</span>
        </div>
        <div class="time-grid">
            <div class="time-item">
                <label>Fajr</label>
                <div class="time-value" id="displayFajr">--</div>
            </div>
            <div class="time-item">
                <label>Dhuhr</label>
                <div class="time-value" id="displayDhuhr">--</div>
            </div>
            <div class="time-item">
                <label>Asr</label>
                <div class="time-value" id="displayAsr">--</div>
            </div>
            <div class="time-item">
                <label>Maghrib</label>
                <div class="time-value" id="displayMaghrib">--</div>
            </div>
            <div class="time-item">
                <label>Isha</label>
                <div class="time-value" id="displayIsha">--</div>
            </div>
        </div>
    </div>

    <!-- ===== GOLD ANIMATED FRIDAY BOX ===== -->
    <div class="friday-box">
        <div class="box-title">
            <i class="fas fa-star"></i> Friday <span>⭐ Special Day</span>
        </div>
        <div class="friday-single">
            <label>Fajr</label>
            <span class="time-value" id="fridayFajrDisplay">--</span>
            <span class="friday-badge">Jumma</span>
        </div>
    </div>

    <div class="action-bar">
        <div>
            <button onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        <span class="badge" id="cacheBadge">📡 Firebase</span>
    </div>

    <div class="footer">
        <span id="updateTime">🔄 Live updates from Firebase</span>
        <span style="margin-left: 12px;">•</span>
        <a onclick="loadData()">⟳ Refresh</a>
    </div>
</div>

<script>
// ========================================
// USER PANEL - FIREBASE REALTIME DB
// ========================================

// --- CONFIG ---
const DB_URL = 'https://namaztimedata-default-rtdb.firebaseio.com/namaz.json';

const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const TIME_IDS = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];

// Display IDs
const DISPLAY_IDS = {
    fajr: 'displayFajr',
    dhuhr: 'displayDhuhr',
    asr: 'displayAsr',
    maghrib: 'displayMaghrib',
    isha: 'displayIsha',
    fridayFajr: 'fridayFajrDisplay'
};

// --- STATE ---
let currentData = {};
let isUpdating = false;

const statusBar = document.getElementById('statusBar');
const cacheBadge = document.getElementById('cacheBadge');

// ========================================
// UI FUNCTIONS
// ========================================
function setStatus(msg, type = 'loading') {
    statusBar.className = `status-bar ${type}`;
    const icons = { loading: '⏳', success: '✅', error: '❌', warning: '⚠️', update: '🔄' };
    statusBar.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${msg}`;
}

// ========================================
// RENDER TIMINGS
// ========================================
function renderTimings(data) {
    const monday = data['Monday'] || {};
    
    // Render Monday timings
    document.getElementById(DISPLAY_IDS.fajr).textContent = monday.fajr || '--';
    document.getElementById(DISPLAY_IDS.dhuhr).textContent = monday.dhuhr || '--';
    document.getElementById(DISPLAY_IDS.asr).textContent = monday.asr || '--';
    document.getElementById(DISPLAY_IDS.maghrib).textContent = monday.maghrib || '--';
    document.getElementById(DISPLAY_IDS.isha).textContent = monday.isha || '--';
    
    // Render Friday Fajr
    const friday = data['Friday'] || {};
    document.getElementById(DISPLAY_IDS.fridayFajr).textContent = friday.fajr || '--';
}

// ========================================
// LOAD DATA FROM FIREBASE
// ========================================
async function loadData() {
    setStatus('Loading from Firebase...', 'loading');
    cacheBadge.textContent = '🔄 Loading...';

    try {
        const response = await fetch(DB_URL, {
            cache: 'no-cache',
            headers: { 'Cache-Control': 'no-cache, no-store' }
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();

        if (data && typeof data === 'object' && Object.keys(data).length > 0) {
            const hasValidData = DAYS.some(day => data[day] && typeof data[day] === 'object');
            if (hasValidData) {
                currentData = data;
                renderTimings(data);
                setStatus('✅ Live from Firebase!', 'success');
                cacheBadge.textContent = '📡 Live';
                cacheBadge.className = 'badge';
                updateTimeDisplay();
                return;
            }
        }

        // If data invalid, use default
        currentData = getDefaultData();
        renderTimings(currentData);
        setStatus('⚠️ Using default data', 'warning');
        cacheBadge.textContent = '📂 Default';
        cacheBadge.className = 'badge';

    } catch (error) {
        setStatus('⚠️ Error: ' + error.message, 'error');
        // Try backup
        const backup = localStorage.getItem('namaz_backup');
        if (backup) {
            try {
                const parsed = JSON.parse(backup);
                if (parsed && typeof parsed === 'object') {
                    currentData = parsed;
                    renderTimings(parsed);
                    setStatus('📂 Using cached data', 'warning');
                    cacheBadge.textContent = '📂 Cached';
                    cacheBadge.className = 'badge';
                    return;
                }
            } catch (e) {}
        }
        currentData = getDefaultData();
        renderTimings(currentData);
        setStatus('📂 Default data (offline)', 'warning');
        cacheBadge.textContent = '📂 Offline';
        cacheBadge.className = 'badge';
    }
}

// ========================================
// GET DEFAULT DATA
// ========================================
function getDefaultData() {
    return {
        "Monday": { "fajr": "5:30 AM", "dhuhr": "12:30 PM", "asr": "4:00 PM", "maghrib": "6:30 PM", "isha": "8:00 PM" },
        "Tuesday": { "fajr": "5:28 AM", "dhuhr": "12:32 PM", "asr": "4:02 PM", "maghrib": "6:32 PM", "isha": "8:02 PM" },
        "Wednesday": { "fajr": "5:26 AM", "dhuhr": "12:34 PM", "asr": "4:04 PM", "maghrib": "6:34 PM", "isha": "8:04 PM" },
        "Thursday": { "fajr": "5:24 AM", "dhuhr": "12:36 PM", "asr": "4:06 PM", "maghrib": "6:36 PM", "isha": "8:06 PM" },
        "Friday": { "fajr": "5:22 AM", "dhuhr": "12:38 PM", "asr": "4:08 PM", "maghrib": "6:38 PM", "isha": "8:08 PM" },
        "Saturday": { "fajr": "5:20 AM", "dhuhr": "12:40 PM", "asr": "4:10 PM", "maghrib": "6:40 PM", "isha": "8:10 PM" },
        "Sunday": { "fajr": "5:18 AM", "dhuhr": "12:42 PM", "asr": "4:12 PM", "maghrib": "6:42 PM", "isha": "8:12 PM" }
    };
}

// ========================================
// UPDATE TIME DISPLAY
// ========================================
function updateTimeDisplay() {
    const now = new Date();
    document.getElementById('updateTime').textContent = '🔄 Last update: ' + now.toLocaleTimeString();
}

// ========================================
// LISTEN FOR ADMIN UPDATES
// ========================================
function listenForUpdates() {
    // BroadcastChannel for same browser
    try {
        if (typeof BroadcastChannel !== 'undefined') {
            const channel = new BroadcastChannel('namaz_updates');
            channel.onmessage = function(e) {
                if (e.data?.type === 'update') {
                    cacheBadge.textContent = '🔄 Updating...';
                    cacheBadge.className = 'badge update';
                    setStatus('📢 New timings available!', 'update');
                    setTimeout(loadData, 500);
                }
            };
        }
    } catch (e) {}

    // localStorage for cross-tab
    window.addEventListener('storage', function(e) {
        if (e.key === 'namaz_update_flag' && e.newValue === 'true') {
            localStorage.removeItem('namaz_update_flag');
            cacheBadge.textContent = '🔄 Updating...';
            cacheBadge.className = 'badge update';
            setStatus('📢 Update detected!', 'update');
            setTimeout(loadData, 300);
        }
    });
}

// ========================================
// AUTO REFRESH
// ========================================
let autoRefreshTimer = null;

function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(() => {
        loadData();
    }, 30000);
}

// ========================================
// KEYBOARD SHORTCUTS
// ========================================
document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
        e.preventDefault();
        loadData();
    }
});

// ========================================
// INIT
// ========================================
listenForUpdates();
loadData();
startAutoRefresh();

console.log('👀 User Panel - Real-time Updates');
console.log('📌 Data URL:', DB_URL);
console.log('⌨️ Ctrl+R = Refresh');
</script>

</body>
</html>
