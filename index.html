<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕌 Namaz Timings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 750px;
            width: 100%;
            margin: auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            padding: 10px 0 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 16px;
        }
        .header h1 { color: #fff; font-size: 24px; font-weight: 700; }
        .header h1 span { color: #64ffda; }
        .header .badge-user {
            background: rgba(105,219,124,0.12);
            color: #69db7c;
            padding: 2px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            margin-top: 4px;
            display: inline-block;
            border: 1px solid rgba(105,219,124,0.15);
        }
        .header p { color: #8892b0; font-size: 12px; margin-top: 4px; }

        .status-bar {
            background: transparent !important;
            padding: 6px 14px;
            margin-bottom: 10px;
            color: #ccd6f6;
            font-size: 12px;
            transition: all 0.3s;
            border: none !important;
            box-shadow: none !important;
        }
        .status-bar.loading { color: #fcc419; }
        .status-bar.success { color: #69db7c; }
        .status-bar.error { color: #ff6b6b; }
        .status-bar.info { color: #64ffda; }
        .status-bar.update { color: #fcc419; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .action-bar button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #8892b0;
            padding: 5px 14px;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .action-bar button:hover { background: rgba(255,255,255,0.08); color: #ccd6f6; border-color: rgba(255,255,255,0.12); }
        .action-bar .badge {
            background: rgba(105,219,124,0.08);
            color: #69db7c;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 500;
        }
        .action-bar .badge.update-available {
            background: rgba(252,196,25,0.08);
            color: #fcc419;
        }
        .action-bar .badge.error { background: rgba(255,107,107,0.08); color: #ff6b6b; }

        .friday-box {
            background: linear-gradient(135deg, rgba(252,196,25,0.06), rgba(252,196,25,0.01));
            border: 2px solid rgba(252,196,25,0.15);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 14px;
            display: none;
            transition: all 0.3s;
        }
        .friday-box.show { display: block; animation: fadeSlide 0.3s ease; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .friday-box .box-title {
            color: #fcc419;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .friday-box .box-title span {
            background: rgba(252,196,25,0.1);
            padding: 1px 12px;
            border-radius: 20px;
            font-size: 8px;
            color: #fcc419;
        }
        .friday-single {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .friday-single label {
            color: #fcc419;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
