<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕌 Namaz Timings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 750px;
            width: 100%;
            margin: auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            padding: 10px 0 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 16px;
        }
        .header h1 { color: #fff; font-size: 24px; font-weight: 700; }
        .header h1 span { color: #64ffda; }
        .header .badge-user {
            background: rgba(105,219,124,0.12);
            color: #69db7c;
            padding: 2px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            margin-top: 4px;
            display: inline-block;
            border: 1px solid rgba(105,219,124,0.15);
        }
        .header p { color: #8892b0; font-size: 12px; margin-top: 4px; }

        .status-bar {
            background: transparent !important;
            padding: 6px 14px;
            margin-bottom: 10px;
            color: #ccd6f6;
            font-size: 12px;
            transition: all 0.3s;
            border: none !important;
            box-shadow: none !important;
        }
        .status-bar.loading { color: #fcc419; }
        .status-bar.success { color: #69db7c; }
        .status-bar.error { color: #ff6b6b; }
        .status-bar.info { color: #64ffda; }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .action-bar button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #8892b0;
            padding: 5px 14px;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .action-bar button:hover { background: rgba(255,255,255,0.08); color: #ccd6f6; border-color: rgba(255,255,255,0.12); }
        .action-bar .badge {
            background: rgba(105,219,124,0.08);
            color: #69db7c;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 500;
        }
        .action-bar .badge.error { background: rgba(255,107,107,0.08); color: #ff6b6b; }

        .friday-box {
            background: linear-gradient(135deg, rgba(252,196,25,0.06), rgba(252,196,25,0.01));
            border: 2px solid rgba(252,196,25,0.15);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 14px;
            display: none;
            transition: all 0.3s;
        }
        .friday-box.show { display: block; animation: fadeSlide 0.3s ease; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .friday-box .box-title {
            color: #fcc419;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .friday-box .box-title span {
            background: rgba(252,196,25,0.1);
            padding: 1px 12px;
            border-radius: 20px;
            font-size: 8px;
            color: #fcc419;
        }
        .friday-single {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .friday-single label {
            color: #fcc419;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .friday-single .time-value {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            padding: 4px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            border: 1.5px solid rgba(255,255,255,0.06);
        }
        .friday-single .friday-badge {
            background: rgba(252,196,25,0.08);
            color: #fcc419;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 8px;
        }

        .timings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }
        .time-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .time-box:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(100,255,218,0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .time-box label {
            display: block;
            color: #64ffda;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }
        .time-box .time-value {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            padding: 6px 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border: 1.5px solid rgba(255,255,255,0.06);
        }

        .more-box {
            background: rgba(255,255,255,0.04);
            border: 1px dashed rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: inherit;
        }
        .more-box:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(100,255,218,0.25);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(100,255,218,0.05);
        }
        .more-box:active { transform: scale(0.95); }
        .more-box .more-title { color: #64ffda; font-size: 13px; font-weight: 600; }
        .more-box .more-sub { color: #495670; font-size: 9px; margin-top: 2px; }
        .more-box .more-arrow { color: #495670; font-size: 11px; margin-top: 2px; display: inline-block; transition: transform 0.3s; }
        .more-box:hover .more-arrow { transform: translateX(4px); color: #64ffda; }

        .footer {
            text-align: center;
            margin-top: 14px;
            color: #495670;
            font-size: 9px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .footer a { color: #64ffda; text-decoration: none; cursor: pointer; }

        @media (max-width: 550px) {
            .timings-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .container { padding: 14px; }
            .time-box .time-value { font-size: 15px; }
            .friday-single .time-value { font-size: 15px; }
            .header h1 { font-size: 20px; }
        }
        @media (max-width: 380px) {
            .timings-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .time-box { padding: 10px 6px; }
            .time-box .time-value { font-size: 13px; padding: 4px 2px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🕌 Namaz <span>Timings</span></h1>
        <div class="badge-user">👀 Read Only</div>
        <p>Daily Prayer Times</p>
    </div>

    <div class="status-bar loading" id="statusBar">
        <span>⏳</span> Loading timings...
    </div>

    <div class="action-bar">
        <div>
            <button onclick="loadData()">🔄 Refresh</button>
        </div>
        <span class="badge" id="cacheBadge">● Live</span>
    </div>

    <div class="friday-box" id="fridayBox">
        <div class="box-title">⭐ Friday <span>Special</span></div>
        <div class="friday-single">
            <label>Fajr</label>
            <span class="time-value" id="fridayFajrDisplay">--</span>
            <span class="friday-badge">Jumma</span>
        </div>
    </div>

    <div class="timings-grid" id="timingsGrid">
        <div class="time-box">
            <label>Fajr</label>
            <div class="time-value" id="displayFajr">--</div>
        </div>
        <div class="time-box">
            <label>Dhuhr</label>
            <div class="time-value" id="displayDhuhr">--</div>
        </div>
        <div class="time-box">
            <label>Asr</label>
            <div class="time-value" id="displayAsr">--</div>
        </div>
        <div class="time-box">
            <label>Maghrib</label>
            <div class="time-value" id="displayMaghrib">--</div>
        </div>
        <div class="time-box">
            <label>Isha</label>
            <div class="time-value" id="displayIsha">--</div>
        </div>
        <a href="https://github.com/gullnoor596-svg/Namaz-time-" target="_blank" class="more-box">
            <div class="more-content">
                <div class="more-title">More</div>
                <div class="more-sub">GitHub</div>
                <div class="more-arrow">↗</div>
            </div>
        </a>
    </div>

    <div class="footer">
        <span>🔄 Auto-refresh every 30 seconds</span>
    </div>
</div>

<script>
// ========================================
// USER PANEL - READ ONLY
// ========================================
const REPO_OWNER = 'gullnoor596-svg';
const REPO_NAME = 'Namaz-time-';
const FILE_PATH = 'config.json';
const BRANCH = 'main';

const RAW_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${FILE_PATH}`;
const PROXY_URL = 'https://api.allorigins.win/raw?url=';

const DEFAULT_DATA = [
    { "day": "Monday", "fajr": "5:30 AM", "dhuhr": "12:30 PM", "asr": "4:00 PM", "maghrib": "6:30 PM", "isha": "8:00 PM" },
    { "day": "Tuesday", "fajr": "5:28 AM", "dhuhr": "12:32 PM", "asr": "4:02 PM", "maghrib": "6:32 PM", "isha": "8:02 PM" },
    { "day": "Wednesday", "fajr": "5:26 AM", "dhuhr": "12:34 PM", "asr": "4:04 PM", "maghrib": "6:34 PM", "isha": "8:04 PM" },
    { "day": "Thursday", "fajr": "5:24 AM", "dhuhr": "12:36 PM", "asr": "4:06 PM", "maghrib": "6:36 PM", "isha": "8:06 PM" },
    { "day": "Friday", "fajr": "5:22 AM", "dhuhr": "12:38 PM", "asr": "4:08 PM", "maghrib": "6:38 PM", "isha": "8:08 PM" },
    { "day": "Saturday", "fajr": "5:20 AM", "dhuhr": "12:40 PM", "asr": "4:10 PM", "maghrib": "6:40 PM", "isha": "8:10 PM" },
    { "day": "Sunday", "fajr": "5:18 AM", "dhuhr": "12:42 PM", "asr": "4:12 PM", "maghrib": "6:42 PM", "isha": "8:12 PM" }
];

let currentData = [];
let loadCounter = 0;

const statusBar = document.getElementById('statusBar');
const cacheBadge = document.getElementById('cacheBadge');
const fridayBox = document.getElementById('fridayBox');

function setStatus(msg, type = 'loading') {
    statusBar.className = `status-bar ${type}`;
    const icons = { loading: '⏳', success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
    statusBar.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${msg}`;
}

// ========================================
// LOAD DATA - READ ONLY
// ========================================
async function loadData() {
    loadCounter++;
    const cacheBuster = Date.now() + '_' + loadCounter;
    
    setStatus('Loading timings...', 'loading');
    cacheBadge.textContent = '◉';

    try {
        let data = null;

        // Direct fetch
        try {
            const url = RAW_URL + '?t=' + cacheBuster;
            const response = await fetch(url, {
                cache: 'no-cache',
                headers: { 'Cache-Control': 'no-cache, no-store', 'Pragma': 'no-cache' }
            });
            if (response.ok) {
                data = await response.json();
            }
        } catch (e) {}

        // Proxy fallback
        if (!data || !Array.isArray(data) || data.length === 0) {
            try {
                const proxyUrl = PROXY_URL + encodeURIComponent(RAW_URL + '?t=' + cacheBuster);
                const response = await fetch(proxyUrl, {
                    cache: 'no-cache',
                    headers: { 'Cache-Control': 'no-cache, no-store', 'Pragma': 'no-cache' }
                });
                if (response.ok) {
                    data = await response.json();
                }
            } catch (e) {}
        }

        // LocalStorage backup
        if (!data || !Array.isArray(data) || data.length === 0) {
            const backup = localStorage.getItem('namaz_backup');
            if (backup) {
                try {
                    data = JSON.parse(backup);
                } catch (e) {}
            }
        }

        // Default data
        if (!data || !Array.isArray(data) || data.length === 0) {
            data = DEFAULT_DATA;
        }

        currentData = data;
        localStorage.setItem('namaz_backup', JSON.stringify(data));
        
        renderAll(data);
        
        setStatus('✅ ' + data.length + ' days loaded', 'success');
        cacheBadge.textContent = '● Live';

    } catch (error) {
        setStatus('⚠️ ' + error.message, 'error');
        cacheBadge.textContent = '◉ Error';
        cacheBadge.className = 'badge error';
        
        renderAll(DEFAULT_DATA);
        setStatus('📂 Default timings', 'warning');
        cacheBadge.textContent = '● Default';
        cacheBadge.className = 'badge';
    }
}

// ========================================
// RENDER - READ ONLY
// ========================================
function renderAll(data) {
    const monday = data[0] || {};
    
    // Render 5 times
    document.getElementById('displayFajr').textContent = monday.fajr || '--';
    document.getElementById('displayDhuhr').textContent = monday.dhuhr || '--';
    document.getElementById('displayAsr').textContent = monday.asr || '--';
    document.getElementById('displayMaghrib').textContent = monday.maghrib || '--';
    document.getElementById('displayIsha').textContent = monday.isha || '--';
    
    // Render Friday
    const friday = data.find(d => d.day === 'Friday');
    if (friday) {
        document.getElementById('fridayFajrDisplay').textContent = friday.fajr || '--';
        fridayBox.classList.add('show');
    } else {
        fridayBox.classList.remove('show');
    }
}

// ========================================
// LISTEN FOR ADMIN UPDATES
// ========================================
function listenForUpdates() {
    try {
        if (typeof BroadcastChannel !== 'undefined') {
            const channel = new BroadcastChannel('namaz_updates');
            channel.onmessage = function(event) {
                if (event.data && event.data.type === 'update') {
                    setStatus('📢 New update available! Refreshing...', 'info');
                    cacheBadge.textContent = '🔄';
                    cacheBadge.className = 'badge';
                    setTimeout(function() {
                        loadData();
                    }, 500);
                }
            };
        }
    } catch (e) {}
}

// ========================================
// KEYBOARD SHORTCUTS
// ========================================
document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
        e.preventDefault();
        loadData();
    }
});

// ========================================
// AUTO REFRESH EVERY 30 SECONDS
// ========================================
setInterval(function() {
    loadData();
}, 30000);

// ========================================
// INIT
// ========================================
listenForUpdates();
loadData();

console.log('👀 User Panel - Read Only');
console.log('⌨️ Ctrl+R = Refresh');
console.log('🔄 Auto-refresh every 30 seconds');
console.log('📡 Listening for admin updates...');
</script>

</body>
</html>
